server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Must be at least MAX_UPLOAD_MB of the API.
    client_max_body_size 60m;

    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # A question on a 6 GB GPU can take a while on a cold model.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";

        # nginx's default MIME table has no .mjs entry; browsers refuse to start the
        # pdf.js module worker when it is served as application/octet-stream.
        location ~ \.mjs$ {
            types { text/javascript mjs; }
        }
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
